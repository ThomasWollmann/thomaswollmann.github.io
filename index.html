    <!-- Shared Standard Vertex Shader -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;

        void main()	{
            vUv = uv;
            gl_Position = vec4( position, 1.0 );
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        varying vec2 vUv;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform vec2 u_mouse;

        mat2 rot2d(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        // Palette generator for volumetric coloring
        vec3 palette(float t) {
            vec3 a = vec3(0.5, 0.4, 0.6);
            vec3 b = vec3(0.5, 0.5, 0.4);
            vec3 c = vec3(1.0, 1.0, 1.0);
            vec3 d = vec3(0.0, 0.15, 0.25);
            return a + b * cos(6.28318 * (c * t + d));
        }

        // Distance Map Generator using a 3D Gyroid Lattice
        float map(vec3 p) {
            vec3 q = p * 1.2;
            
            // Subtle space-folding twist matching standard dynamic rates
            q.xy *= rot2d(u_time * 0.08);
            q.xz *= rot2d(u_time * 0.05);
            
            float gyroid = abs(dot(sin(q), cos(q.zxy))) / 1.2 - 0.03;
            
            // Open infinite cylinder along the camera ray path using dynamic cursor target offset
            float path = length(p.xy - u_mouse * 0.6) - 1.1;
            
            return max(gyroid, -path);
        }

        void main() {
            // Correct for screen aspect ratios in normalized coordinates
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            
            // Set up camera positions and volumetric coordinate vectors
            vec3 ro = vec3(0.0, 0.0, u_time * 0.4);
            vec3 rd = normalize(vec3(uv, 1.0));
            
            // Dynamic look rotations based on user's cursor pointer
            rd.xy *= rot2d(u_mouse.y * 0.25);
            rd.xz *= rot2d(u_mouse.x * 0.25);

            float t = 0.0;
            float glow = 0.0;
            
            // Ultra-performant 35-step raymarcher loop safe for high frames on mobile GPUs
            for (int i = 0; i < 35; i++) {
                vec3 p = ro + rd * t;
                float d = map(p);
                
                // Accumulate volumetric dynamic light map
                glow += exp(-d * 5.5);
                
                if (d < 0.002 || t > 18.0) break;
                t += d * 0.65;
            }

            vec3 col = vec3(0.0);
            vec3 colorBase = palette(t * 0.06 + u_time * 0.03);
            
            // Tone calculations with volumetric glow maps
            col += colorBase * (glow * 0.025);
            col += vec3(0.08, 0.04, 0.15) / (1.0 + t * t * 0.1);
            
            // Ambient fog mapping
            col *= 1.0 - (t * 0.045);
            
            // Post processing contrasts
            col = clamp(col, 0.0, 1.0);
            col = pow(col, vec3(1.15));
            
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let uniforms;
        
        // Track smoothed/damped mouse inputs for elegant transitions
        let mouse = new THREE.Vector2(0, 0);
        let targetMouse = new THREE.Vector2(0, 0);

        init();
        animate();
        onWindowResize();
        window.addEventListener( 'resize', onWindowResize );

        // Cursor & Touch move events listeners
        window.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2.0 - 1.0;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2.0 + 1.0;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                targetMouse.x = (e.touches[0].clientX / window.innerWidth) * 2.0 - 1.0;
                targetMouse.y = -(e.touches[0].clientY / window.innerHeight) * 2.0 + 1.0;
            }
        }, { passive: true });

        // Device orientation (gyro) input for mobile devices
        let gyroEnabled = false;

        function handleOrientation(event) {
            // gamma: left-right tilt in degrees [-90, 90]
            // beta: front-back tilt in degrees [-180, 180]
            if (event.gamma === null || event.beta === null) return;
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            // Map a comfortable tilt range (~±30°) to [-1, 1]
            targetMouse.x = clamp(event.gamma / 30, -1, 1);
            targetMouse.y = clamp(-(event.beta - 45) / 30, -1, 1);
            gyroEnabled = true;
        }

        function enableGyro() {
            // iOS 13+ requires explicit user-gesture permission
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(() => {});
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // Attempt to attach immediately (works on Android / non-iOS browsers)
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission !== 'function') {
            window.addEventListener('deviceorientation', handleOrientation);
        }

        // On iOS, request permission on first user interaction
        const requestGyroOnce = () => {
            enableGyro();
            window.removeEventListener('touchend', requestGyroOnce);
            window.removeEventListener('click', requestGyroOnce);
        };
        window.addEventListener('touchend', requestGyroOnce, { once: true });
        window.addEventListener('click', requestGyroOnce, { once: true });

        function init() {
            const container = document.getElementById('container');
            camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 1 );

            scene = new THREE.Scene();

            const geometry = new THREE.PlaneGeometry( 2, 2 );

            // Setup performance-oriented uniform variables
            uniforms = {
                u_time: { value: 1.0 },
                u_resolution: { value: new THREE.Vector2() },
                u_mouse: { value: new THREE.Vector2() }
            };

            const material = new THREE.ShaderMaterial( {
                uniforms: uniforms,
                vertexShader: document.getElementById( 'vertexShader' ).textContent,
                fragmentShader: document.getElementById( 'fragmentShader' ).textContent
            } );

            const mesh = new THREE.Mesh( geometry, material );
            scene.add( mesh );

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            
            // Cap pixel ratio to max 1.5 for exceptional responsiveness on high-DPI smartphone screens
            const pixelRatio = Math.min(window.devicePixelRatio, 1.5);
            renderer.setPixelRatio( pixelRatio );
            
            container.appendChild( renderer.domElement );
        }

        function onWindowResize() {
            renderer.setSize( window.innerWidth, window.innerHeight );
            uniforms.u_resolution.value.set( window.innerWidth, window.innerHeight );
        }

        function animate() {
            requestAnimationFrame( animate );

            // Smooth linear interpolation for target mouse cursor coordinates
            mouse.x += (targetMouse.x - mouse.x) * 0.08;
            mouse.y += (targetMouse.y - mouse.y) * 0.08;
            uniforms.u_mouse.value.copy(mouse);

            uniforms.u_time.value = performance.now() / 1000;
            renderer.render( scene, camera );
        }
    </script>
